version: '3.8'

services:
  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: investment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-investment_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend (FastAPI Python)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: investment_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-investment_db}
      - BRAPI_TOKEN=${BRAPI_TOKEN:-""}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-""}
    depends_on:
      - db
    # Comando de inicialização com Hot Reload para desenvolvimento
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investment_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}

volumes:
  postgres_data:
