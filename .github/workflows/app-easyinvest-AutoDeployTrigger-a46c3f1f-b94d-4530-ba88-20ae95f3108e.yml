name: Trigger auto deployment for app-easyinvest

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/app-easyinvest-AutoDeployTrigger-a46c3f1f-b94d-4530-ba88-20ae95f3108e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPEASYINVEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPEASYINVEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPEASYINVEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acreasyinvest.azurecr.io
          registryUsername: ${{ secrets.APPEASYINVEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPEASYINVEST_REGISTRY_PASSWORD }}
          containerAppName: app-easyinvest
          resourceGroup: rg-easyinvest
          imageToBuild: acreasyinvest.azurecr.io/app-easyinvest:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


