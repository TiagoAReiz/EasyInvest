name: Trigger auto deployment for app-easyinvest

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/app-easyinvest-AutoDeployTrigger-a46c3f1f-b94d-4530-ba88-20ae95f3108e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPEASYINVEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPEASYINVEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPEASYINVEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: acreasyinvest.azurecr.io
          registryUsername: ${{ secrets.APPEASYINVEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPEASYINVEST_REGISTRY_PASSWORD }}
          containerAppName: app-easyinvest
          resourceGroup: rg-easyinvest
          imageToBuild: acreasyinvest.azurecr.io/app-easyinvest:${{ github.sha }}
          environmentVariables: >
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TOKEN_EXPIRATION_SECONDS=3600
            JWT_REFRESH_TOKEN_EXPIRATION_SECONDS=604800
            BRAPI_TOKEN=${{ secrets.BRAPI_TOKEN }}
            BRAPI_BASE_URL=https://brapi.dev/api
            BCB_SGS_BASE_URL=https://api.bcb.gov.br/dados/serie
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}


